<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>なんでもたきこみごはん</title>
<meta name="description" content="わたしだけの炊き込みご飯を楽しむアプリ">
<meta name="theme-color" content="#f6efe0">
<meta property="og:type" content="website">
<meta property="og:title" content="なんでもたきこみごはん">
<meta property="og:description" content="わたしだけの炊き込みご飯を楽しむアプリ">
<meta property="og:image" content="./ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="なんでもたきこみごはん">
<meta name="twitter:description" content="わたしだけの炊き込みご飯を楽しむアプリ">
<meta name="twitter:image" content="./ogp.png">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --paper:#fbf6ea; --bg:#f1e8d4; --ink:#3b2f26; --sub:#6b5b4d; --line:#c9b79a; --accent:#8c4a2f;
  --gu:#006b52; --gu-bg:#e1f2ec;
  --cho:#9a5b00; --cho-bg:#fdecc8;
  --mizu:#0b5a8c; --mizu-bg:#dff0fb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.6;
  background-image:radial-gradient(rgba(140,100,60,.07) 1px,transparent 1px);background-size:14px 14px;}
button{font:inherit;color:inherit;cursor:pointer}
button,input,textarea{touch-action:manipulation}
:focus-visible{outline:3px solid #1b1b1b;outline-offset:2px}
.serif{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}

/* header */
header.top{position:sticky;top:0;z-index:50;background:rgba(246,239,224,.96);border-bottom:2px solid var(--line);padding:8px clamp(8px,3vw,32px);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;backdrop-filter:blur(4px)}
.brand h1{margin:0;font-size:clamp(1.05rem,2.6vw,1.5rem);letter-spacing:.06em}
.brand p{margin:0;font-size:.78rem;color:var(--sub)}
.menu{display:flex;gap:6px;flex-wrap:wrap}
.menu button{min-width:44px;min-height:44px;padding:6px 12px;border:2px solid var(--accent);background:#fffaf0;border-radius:12px;font-size:.88rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.menu button:active{transform:scale(.96)}

/* book */
.wrap{padding:16px clamp(8px,5vw,64px) 8px}
.book{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:2px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(80,50,20,.18);overflow:hidden}
.page{padding:16px clamp(12px,2.5vw,28px) 22px;min-width:0}
.page.left{border-right:3px double var(--line);background:linear-gradient(90deg,transparent 96%,rgba(120,90,50,.08))}
.page.right{background:linear-gradient(270deg,transparent 96%,rgba(120,90,50,.08))}
@media (max-width:760px),(orientation:portrait){
  .book{grid-template-columns:1fr}
  .page.left{border-right:0;border-bottom:3px double var(--line)}
}
.cardhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.cardhead input{font:inherit;border:0;border-bottom:2px dashed var(--line);background:transparent;color:var(--ink);padding:6px 4px;min-height:44px}
#titleIn{flex:1 1 220px;font-size:1.1rem;font-weight:700}
#dateIn{flex:0 0 auto;font-size:.9rem}
.sechead{margin:0 0 8px;font-size:.95rem;color:var(--accent);border-left:5px solid var(--accent);padding-left:8px}

/* left board */
.board{display:grid;grid-template-columns:1fr minmax(150px,200px) 1fr;grid-template-areas:"gu cooker cho" "mizu mizu mizu";gap:10px;align-items:start}
#grp-gu{grid-area:gu}#grp-cho{grid-area:cho}#grp-mizu{grid-area:mizu}.cookerWrap{grid-area:cooker}
@media (max-width:520px){.board{grid-template-columns:1fr;grid-template-areas:"cooker" "gu" "cho" "mizu"}}
.cookerBtn{display:block;width:100%;background:transparent;border:0;padding:0;border-radius:16px}
.cookerBtn:active{transform:scale(.97)}
.cookerBtn svg{width:100%;height:auto;display:block}
.cookerHint{text-align:center;font-size:.8rem;color:var(--sub);margin-top:2px}
.grp{border-radius:12px;padding:8px;min-height:80px}
.grp h3{margin:0 0 6px;font-size:.9rem;display:flex;align-items:center;gap:6px}
.grp.gu{background:var(--gu-bg);border:2px solid var(--gu);color:var(--gu)}
.grp.cho{background:var(--cho-bg);border:2px dashed var(--cho);color:var(--cho)}
.grp.mizu{background:var(--mizu-bg);border:3px double var(--mizu);color:var(--mizu)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:6px 10px;background:#fff;border:2px solid currentColor;border-radius:10px;color:var(--ink);font-size:.9rem;text-align:left;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip .tag{font-size:.68rem;font-weight:700;padding:0 6px;border-radius:6px;background:currentColor;color:#fff;white-space:nowrap}
.grp.gu .chip .tag{background:var(--gu)}.grp.cho .chip .tag{background:var(--cho)}.grp.mizu .chip .tag{background:var(--mizu)}
.chip .amt{color:var(--sub);font-size:.82rem}
.addbtn{min-height:44px;min-width:44px;padding:6px 12px;border:2px dashed currentColor;background:transparent;border-radius:10px;font-weight:700;font-size:.85rem;color:inherit}
.empty{font-size:.8rem;color:var(--sub);align-self:center}
.cookBtn{display:block;width:100%;margin-top:14px;min-height:60px;font-size:1.25rem;font-weight:800;letter-spacing:.08em;color:#fff;background:#9c3d1b;border:3px solid #5c230d;border-radius:16px;box-shadow:0 5px 0 #5c230d;padding:10px}
.cookBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #5c230d}

/* right page */
.status{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;border:2px solid var(--accent);margin-bottom:8px}
.photoBox{border:2px dashed var(--line);border-radius:12px;background:#fff;min-height:160px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photoBox img{width:100%;max-height:320px;object-fit:cover;display:block}
.photoBox span{color:var(--sub);font-size:.85rem;padding:12px;text-align:center}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.btn{min-height:44px;min-width:44px;padding:8px 14px;border:2px solid var(--accent);border-radius:12px;background:#fffaf0;font-weight:700;font-size:.9rem}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{border-color:#7a1f1f;color:#7a1f1f}
.btn:active{transform:scale(.97)}
.stars{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.star{min-width:48px;min-height:48px;font-size:1.7rem;line-height:1;border:2px solid var(--line);background:#fff;border-radius:12px;color:#7a4b00}
.star[aria-pressed="true"]{background:#fff2c2;border-color:#7a4b00}
.starTxt{font-weight:700;font-size:.9rem;margin-left:6px}
textarea#memo{width:100%;min-height:130px;padding:10px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink);resize:vertical}
textarea#memo::placeholder{color:#8a8a8a}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:12px}

/* modal */
#overlay{position:fixed;inset:0;z-index:100;background:rgba(40,25,10,.55);display:none;align-items:center;justify-content:center;padding:12px}
#overlay.show{display:flex}
#modal{background:var(--paper);border:3px solid var(--accent);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#modal h2{margin:0 0 10px;font-size:1.15rem}
#modal ul{padding-left:1.2em;margin:.4em 0}
#modal li{margin:.3em 0}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px}
.field input{width:100%;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.rlist{list-style:none;padding:0!important;margin:8px 0}
.ritem{border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;background:#fff}
.ritem.now{border-color:var(--accent);background:#fff6e6}
.ritem .rt{font-weight:700;word-break:break-all}
.ritem .rm{font-size:.8rem;color:var(--sub)}
.ritem .rb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.check li{list-style:none;margin-left:-1.2em}
.err{color:#8a1c1c;font-weight:700;font-size:.85rem;min-height:1.3em}

/* lock */
#lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;text-align:center}
#lock.show{display:flex}
#lock input{width:10em;min-height:52px;font-size:1.6rem;text-align:center;letter-spacing:.4em;border:3px solid var(--accent);border-radius:12px;background:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* steam animation (独立パーツ) */
#steam{position:fixed;inset:0;z-index:200;background:rgba(251,246,234,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#steam.show{display:flex}
.steamStage{position:relative;width:min(300px,70vw)}
.steamStage svg{width:100%;height:auto;display:block}
.puff{position:absolute;bottom:62%;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,rgba(150,150,150,.55),rgba(190,190,190,0) 70%);opacity:0;animation:rise 2.6s ease-out infinite}
.puff:nth-child(1){left:38%;animation-delay:0s}
.puff:nth-child(2){left:48%;animation-delay:.5s;width:58px;height:58px}
.puff:nth-child(3){left:56%;animation-delay:1s}
.puff:nth-child(4){left:43%;animation-delay:1.5s;width:52px;height:52px}
.puff:nth-child(5){left:52%;animation-delay:2s}
@keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:0}25%{opacity:.9}100%{transform:translate(14px,-150px) scale(1.9);opacity:0}}
.steamTxt{font-weight:700;font-size:1.05rem}
@media (prefers-reduced-motion:reduce){.puff{animation-duration:5s}}

/* toast + install */
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#3b2f26;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:400;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#installBar{position:fixed;left:8px;right:8px;bottom:8px;z-index:250;background:#fffaf0;border:3px solid var(--accent);border-radius:16px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translateY(140%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#installBar.show{transform:translateY(0)}
#installBar p{margin:0;flex:1 1 180px;font-size:.88rem;font-weight:700}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1 class="serif">🍚 なんでもたきこみごはん</h1>
    <p>わたしだけの炊き込みご飯を楽しむアプリ</p>
  </div>
  <nav class="menu" aria-label="メニュー">
    <button type="button" id="btnHelp" aria-label="使い方・注意書き">📖 使い方・注意書き</button>
    <button type="button" id="btnList" aria-label="レシピ一覧">📚 レシピ一覧</button>
    <button type="button" id="btnPass" aria-label="パスコード設定">🔒 パスコード設定</button>
  </nav>
</header>

<main class="wrap">
  <div class="book">
    <section class="page left" aria-label="仕込みページ">
      <div class="cardhead">
        <input id="titleIn" class="serif" type="text" maxlength="60" aria-label="レシピタイトル" placeholder="実験 No.1 〇〇の炊き込みご飯">
        <input id="dateIn" type="date" aria-label="日付">
      </div>
      <h2 class="sechead">仕込み（炊飯器をタップして追加）</h2>
      <div class="board">
        <div class="grp gu" id="grp-gu"></div>
        <div class="cookerWrap">
          <button type="button" class="cookerBtn" id="cookerBtn" aria-label="材料・調味料・水加減を追加する"></button>
          <div class="cookerHint">↑ 炊飯器をタップして追加</div>
        </div>
        <div class="grp cho" id="grp-cho"></div>
        <div class="grp mizu" id="grp-mizu"></div>
      </div>
      <button type="button" class="cookBtn serif" id="cookBtn">🍚 炊飯！（スイッチオン！）</button>
    </section>

    <section class="page right" id="rightPage" aria-label="記録ページ">
      <h2 class="sechead">できあがりの記録</h2>
      <div class="status" id="status"></div>

      <div class="photoBox" id="photoBox"></div>
      <div class="btnrow">
        <button type="button" class="btn" id="btnCam">📷 カメラで撮影</button>
        <button type="button" class="btn" id="btnAlbum">🖼 アルバムから選ぶ</button>
        <button type="button" class="btn danger" id="btnPhotoDel">写真を外す</button>
      </div>
      <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
      <input type="file" id="fileAlbum" accept="image/*" hidden>

      <h2 class="sechead" style="margin-top:14px">評価</h2>
      <div class="stars" id="stars" role="group" aria-label="星評価"></div>

      <h2 class="sechead" style="margin-top:14px">メモ</h2>
      <textarea id="memo" maxlength="2000" aria-label="メモ" placeholder="例：おこげの具合、水加減、家族の反応、次回の改善点など"></textarea>

      <div class="actions">
        <button type="button" class="btn primary" id="btnDup">🔁 このレシピを複製（Ver.2を作る）</button>
        <button type="button" class="btn primary" id="btnImg">🖼 レシピカードを画像保存</button>
      </div>
    </section>
  </div>
</main>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="modal"></div></div>

<div id="lock" role="dialog" aria-modal="true" aria-label="ロック画面">
  <div style="font-size:3rem" aria-hidden="true">🔒</div>
  <h2 class="serif" style="margin:0">パスコードを入力</h2>
  <input id="lockIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="4桁のパスコード">
  <div class="err" id="lockErr" role="alert"></div>
  <button type="button" class="btn primary" id="lockBtn">ひらく</button>
</div>

<div id="steam" role="status" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="installBar" role="region" aria-label="ホーム画面に追加">
  <p id="installMsg">📲 ホーム画面に追加してアプリとして使う</p>
  <button type="button" class="btn primary" id="installOk">追加する</button>
  <button type="button" class="btn" id="installClose">閉じる</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  /* ---------- 基本ユーティリティ ---------- */
  var KEY = 'ntg_data_v1', PKEY = 'ntg_pass_v1', IKEY = 'ntg_install_closed_v1';
  var mem = {};
  var store = {
    get: function (k) { try { var v = localStorage.getItem(k); return v === null ? (mem[k] === undefined ? null : mem[k]) : v; } catch (e) { return mem[k] === undefined ? null : mem[k]; } },
    set: function (k, v) { mem[k] = v; try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: function (k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
  };
  var $ = function (s) { return document.querySelector(s); };
  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) { for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    } }
    (kids || []).forEach(function (c) { if (c == null) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3200);
  }

  var TYPES = {
    gu:   { label: '具材',   icon: '🥕' },
    cho:  { label: '調味料', icon: '🧂' },
    mizu: { label: '水加減', icon: '💧' }
  };
  var WATER_PRESETS = ['規定量（合数どおり）', '+50ml', '+30ml', '-30ml', '-50ml'];
  var STAR_TXT = ['未評価', '★1 もう一息', '★2 まあまあ', '★3 おいしい', '★4 とてもおいしい', '★5 最高！'];

  /* ---------- データ ---------- */
  var state = { recipes: [], currentId: null };

  function newRecipe(title) {
    return { id: uid(), title: title || ('実験 No.' + (state.recipes.length + 1)), date: today(), items: [], photo: '', rating: 0, memo: '', cooked: false };
  }
  function load() {
    try {
      var raw = store.get(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.recipes)) { state.recipes = d.recipes; state.currentId = d.currentId; }
      }
    } catch (e) { console.error(e); toast('保存データの読み込みに失敗したため、新しく始めます'); }
    if (!state.recipes.length) { var r = newRecipe(); state.recipes.push(r); state.currentId = r.id; }
    if (!cur()) state.currentId = state.recipes[0].id;
  }
  function cur() { for (var i = 0; i < state.recipes.length; i++) if (state.recipes[i].id === state.currentId) return state.recipes[i]; return null; }
  function save(quiet) {
    try {
      if (store.set(KEY, JSON.stringify(state))) return true;
    } catch (e) { console.error(e); }
    // 容量超過など：現在レシピの写真を除いて文字データだけ保存を試みる
    try {
      var lite = { currentId: state.currentId, recipes: state.recipes.map(function (r) { return r.id === state.currentId ? Object.assign({}, r, { photo: '' }) : r; }) };
      var ok = store.set(KEY, JSON.stringify(lite));
      if (!quiet) toast(ok ? '端末の保存容量がいっぱいのため、写真以外を保存しました' : '保存できませんでした。この画面を開いている間は内容を保持します');
      return ok;
    } catch (e2) { if (!quiet) toast('保存でエラーが起きました。内容はこの画面内で保持します'); return false; }
  }
  var saveTimer = null;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { save(); }, 400); }

  /* ---------- 炊飯器SVG ---------- */
  var COOKER_SVG =
    '<svg viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="炊飯器のイラスト">' +
    '<ellipse cx="100" cy="178" rx="70" ry="8" fill="rgba(90,60,30,.18)"/>' +
    '<rect x="30" y="80" width="140" height="90" rx="26" fill="#f4e3c3" stroke="#8c4a2f" stroke-width="4"/>' +
    '<path d="M36 82 Q100 8 164 82 Z" fill="#fff3da" stroke="#8c4a2f" stroke-width="4" stroke-linejoin="round"/>' +
    '<rect x="88" y="30" width="24" height="12" rx="6" fill="#8c4a2f"/>' +
    '<rect x="52" y="104" width="96" height="30" rx="10" fill="#fffaf0" stroke="#8c4a2f" stroke-width="3"/>' +
    '<circle cx="76" cy="119" r="8" fill="#8c4a2f"/><rect x="94" y="113" width="40" height="12" rx="6" fill="#d9c6a5"/>' +
    '<text x="100" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#8c4a2f" font-family="sans-serif">＋ 追加</text>' +
    '</svg>';

  /* ---------- モーダル基盤 ---------- */
  var lastFocus = null;
  function openModal(title, nodes) {
    var m = $('#modal'), o = $('#overlay'); if (!m || !o) return;
    lastFocus = document.activeElement;
    m.innerHTML = '';
    m.appendChild(h('h2', { id: 'modalTitle', class: 'serif', text: title }));
    nodes.forEach(function (n) { m.appendChild(n); });
    o.classList.add('show');
    var first = m.querySelector('input,button,textarea'); if (first) { try { first.focus(); } catch (e) {} }
  }
  function closeModal() {
    var o = $('#overlay'); if (o) o.classList.remove('show');
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  var ovEl = $('#overlay');
  if (ovEl) ovEl.addEventListener('click', function (e) { if (e.target === ovEl) closeModal(); });

          if (!its.length) { ctx.fillStyle = '#8a8a8a'; ctx.fillText('（なし）', 90, y); y += 38; }
          its.slice(0, 6).forEach(function (i) { ctx.fillStyle = '#3b2f26'; ctx.fillText('・' + i.name + (i.amount ? '　' + i.amount : ''), 90, y, 540); y += 36; });
          if (its.length > 6) { ctx.fillStyle = '#6b5b4d'; ctx.fillText('…ほか' + (its.length - 6) + '件', 90, y); y += 36; }
          y += 36;
        });
        // 右ページ
        var px = 730, py = 70, pw = 610, ph = 380;
        ctx.fillStyle = '#fff'; ctx.fillRect(px, py, pw, ph); ctx.strokeStyle = '#c9b79a'; ctx.lineWidth = 3; ctx.strokeRect(px, py, pw, ph);
        if (img) {
          var s = Math.max(pw / img.width, ph / img.height), sw = pw / s, sh = ph / s;
          ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, px, py, pw, ph);
        } else { ctx.fillStyle = '#8a8a8a'; ctx.font = '28px ' + SANS; ctx.textAlign = 'center'; ctx.fillText('写真なし', px + pw / 2, py + ph / 2); ctx.textAlign = 'left'; }
        ctx.fillStyle = '#7a4b00'; ctx.font = 'bold 42px ' + SANS; ctx.fillText(starStr(r.rating) + '  ' + r.rating + '/5', px, 510);
        ctx.fillStyle = '#3b2f26'; ctx.font = 'bold 26px ' + SANS; ctx.fillText('メモ', px, 560);
        ctx.font = '26px ' + SANS; ctx.fillStyle = '#3b2f26';
        wrapText(ctx, r.memo || '（メモなし）', px, 600, pw, 38, 6);
        ctx.fillStyle = '#6b5b4d'; ctx.font = '18px ' + SANS; ctx.textAlign = 'right';
        ctx.fillText('※ご使用の炊飯器の取扱説明書・最大水位線を守って安全に調理しています', W - 50, H - 48);
        c.toBlob(function (blob) {
          try {
            if (!blob) throw new Error('blob');
            var url = URL.createObjectURL(blob), a = document.createElement('a');
            a.href = url; a.download = 'takikomi-' + r.date + '.png'; document.body.appendChild(a); a.click();
            setTimeout(function () { try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {} }, 1500);
            toast('🖼 レシピカードを画像として保存しました');
          } catch (e) { console.error(e); toast('画像の保存に失敗しました'); }
        }, 'image/png');
      } catch (e) { console.error(e); toast('画像の作成に失敗しました'); }
    };
    try {
      if (r.photo) { var im = new Image(); im.onload = function () { finish(im); }; im.onerror = function () { finish(null); }; im.src = r.photo; }
      else finish(null);
    } catch (e) { finish(null); }
  }

  /* ---------- PWAインストール案内 ---------- */
  var deferredPrompt = null;
  function showInstall(msg) {
    try {
      if (store.get(IKEY)) return;
      var bar = $('#installBar'), m = $('#installMsg'); if (!bar) return;
      if (msg && m) m.textContent = msg;
      setTimeout(function () { bar.classList.add('show'); }, 1200);
    } catch (e) {}
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; showInstall(); });
  window.addEventListener('appinstalled', function () { var b = $('#installBar'); if (b) b.classList.remove('show'); store.set(IKEY, '1'); });
  function setupInstall() {
    var ok = $('#installOk'), cl = $('#installClose'), bar = $('#installBar');
    if (cl) cl.addEventListener('click', function () { if (bar) bar.classList.remove('show'); store.set(IKEY, '1'); });
    if (ok) ok.addEventListener('click', function () {
      try {
        if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(function () { deferredPrompt = null; if (bar) bar.classList.remove('show'); store.set(IKEY, '1'); }); }
        else toast('ブラウザの共有／メニューから「ホーム画面に追加」を選んでください');
      } catch (e) { toast('ブラウザのメニューから「ホーム画面に追加」を選んでください'); }
    });
    var standalone = false;
    try { standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone; } catch (e) {}
    if (!standalone) setTimeout(function () { if (!deferredPrompt) showInstall('📲 ホーム画面に追加してアプリとして使う（共有メニュー →「ホーム画面に追加」）'); }, 2500);
  }

  /* ---------- イベント登録 ---------- */
  function on(sel, ev, fn) { var e = $(sel); if (e) e.addEventListener(ev, function (x) { try { fn(x); } catch (err) { console.error(err); toast('エラーが起きましたが、記録は保持されています'); } }); }

  load();
  var cb = $('#cookerBtn'); if (cb) cb.innerHTML = COOKER_SVG;
  on('#cookerBtn', 'click', openChooser);
  on('#cookBtn', 'click', startCooking);
  on('#btnHelp', 'click', openHelp);
  on('#btnList', 'click', openList);
  on('#btnPass', 'click', openPass);
  on('#titleIn', 'input', function (e) { var r = cur(); if (r) { r.title = e.target.value; saveSoon(); } });
  on('#dateIn', 'change', function (e) { var r = cur(); if (r && e.target.value) { r.date = e.target.value; save(); toast('日付を更新しました'); } });
  on('#memo', 'input', function (e) { var r = cur(); if (r) { r.memo = e.target.value; saveSoon(); } });
  on('#btnCam', 'click', function () { var f = $('#fileCam'); if (f) f.click(); });
  on('#btnAlbum', 'click', function () { var f = $('#fileAlbum'); if (f) f.click(); });
  on('#fileCam', 'change', function (e) { handleFile(e.target.files && e.target.files[0], e.target); });
  on('#fileAlbum', 'change', function (e) { handleFile(e.target.files && e.target.files[0], e.target); });
  on('#btnPhotoDel', 'click', function () { var r = cur(); if (r) { r.photo = ''; save(); renderRight(r); toast('写真を外しました'); } });
  on('#btnDup', 'click', function () { var r = cur(); if (r) dupRecipe(r.id); });
  on('#btnImg', 'click', saveCardImage);

  render();
  setupLock();
  setupInstall();

  try {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        try { navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('SW register failed', e); }); } catch (e) { console.warn(e); }
      });
    }
  } catch (e) { console.warn(e); }
});
</script>
