<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>なんでもたきこみごはん</title>
<meta name="description" content="わたしだけの炊き込みご飯を楽しむアプリ">
<meta name="theme-color" content="#f6efe0">
<meta property="og:type" content="website">
<meta property="og:title" content="なんでもたきこみごはん">
<meta property="og:description" content="わたしだけの炊き込みご飯を楽しむアプリ">
<meta property="og:image" content="./ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="なんでもたきこみごはん">
<meta name="twitter:description" content="わたしだけの炊き込みご飯を楽しむアプリ">
<meta name="twitter:image" content="./ogp.png">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --paper:#fbf6ea; --bg:#f1e8d4; --ink:#3b2f26; --sub:#6b5b4d; --line:#c9b79a; --accent:#8c4a2f; --start:#a8381a; --start-dk:#5f1f0d;
  --gu:#00694f; --gu-bg:#e3f3d9;
  --cho:#8a5300; --cho-bg:#fdeab5;
  --mizu:#0b5a8c; --mizu-bg:#dff0fb;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  background-image:radial-gradient(rgba(140,100,60,.07) 1px,transparent 1px);background-size:14px 14px}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid #1b1b1b;outline-offset:2px}

/* header */
header.top{position:sticky;top:0;z-index:50;background:rgba(246,239,224,.96);border-bottom:2px solid var(--line);padding:8px clamp(8px,3vw,32px);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.brand h1{margin:0;font-size:clamp(1.05rem,4.4vw,1.45rem);letter-spacing:.05em}
.brand p{margin:0;font-size:.78rem;color:var(--sub)}
.menu{display:flex;gap:6px;flex-wrap:wrap}
.menu button{min-width:44px;min-height:44px;padding:6px 12px;border:2px solid var(--accent);background:#fffaf0;border-radius:14px;font-size:.85rem;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.menu button:active{transform:scale(.96)}

/* card (1 column) */
.wrap{padding:16px clamp(12px,6vw,72px) 8px}
.card{max-width:640px;margin:0 auto;background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:0 6px 20px rgba(80,50,20,.16);padding:16px clamp(12px,4vw,26px) 24px}
.card[hidden]{display:none}
.adate{text-align:center;margin-bottom:4px}
.adate #aDate{font-size:1.25rem;font-weight:800;letter-spacing:.04em}
.adate #aTitle{font-size:.95rem;color:var(--sub);word-break:break-all}
#titleIn{display:block;width:100%;margin-top:12px;min-height:48px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:1.05rem;font-weight:700}
#titleIn::placeholder{color:#8a8a8a;font-weight:400}
.sechead{margin:16px 0 8px;font-size:.98rem;color:var(--accent);border-left:5px solid var(--accent);padding-left:8px}

/* cooker */
.cookerWrap{position:relative;width:min(360px,86%);margin:6px auto 0}
.cookerWrap svg{width:100%;height:auto;display:block}
.panel{position:absolute;left:19%;right:19%;top:51%;height:21%;display:flex;gap:6px;align-items:stretch}
.panel button{flex:1;min-height:46px;min-width:44px;border-radius:12px;font-weight:800;font-size:clamp(.75rem,3.4vw,.95rem);line-height:1.15;padding:2px 4px;border:3px solid}
#btnAdd{background:#fffaf0;border-color:var(--accent);color:var(--accent)}
#btnStart{background:var(--start);border-color:var(--start-dk);color:#fff;box-shadow:0 3px 0 var(--start-dk)}
.panel button:active{transform:translateY(2px)}
.hint{text-align:center;font-size:.8rem;color:var(--sub);margin:4px 0 0}

/* item boxes */
.ilist{display:flex;flex-direction:column;gap:8px}
.ibox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px 12px;border-radius:12px;text-align:left;color:var(--ink);background:#fff}
.ibox .tag{font-size:.72rem;font-weight:800;padding:1px 8px;border-radius:7px;color:#fff;white-space:nowrap}
.ibox .nm{font-weight:700;word-break:break-all}
.ibox .am{color:var(--sub);font-size:.88rem}
.ibox.gu{background:var(--gu-bg);border:2px solid var(--gu)} .ibox.gu .tag{background:var(--gu)}
.ibox.cho{background:var(--cho-bg);border:2px dashed var(--cho)} .ibox.cho .tag{background:var(--cho)}
.ibox.mizu{background:var(--mizu-bg);border:4px double var(--mizu)} .ibox.mizu .tag{background:var(--mizu)}
button.ibox:active{transform:scale(.98)}
.empty{font-size:.85rem;color:var(--sub);margin:4px 0}

.btn{min-height:44px;min-width:44px;padding:8px 14px;border:2px solid var(--accent);border-radius:12px;background:#fffaf0;font-weight:700;font-size:.92rem}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{border-color:#7a1f1f;color:#7a1f1f}
.btn.block{display:block;width:100%}
.btn:active{transform:scale(.97)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.status{display:inline-block;font-size:.82rem;font-weight:700;padding:2px 12px;border-radius:99px;border:2px solid var(--accent);margin:2px 0 4px}
.photoBox{border:2px dashed var(--line);border-radius:14px;background:#fff;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photoBox img{width:100%;max-height:340px;object-fit:cover;display:block}
.photoBox span{color:var(--sub);font-size:.88rem;padding:12px;text-align:center}
.stars{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.star{min-width:48px;min-height:48px;font-size:1.7rem;line-height:1;border:2px solid var(--line);background:#fff;border-radius:12px;color:#7a4b00}
.star[aria-pressed="true"]{background:#fff2c2;border-color:#7a4b00}
.starTxt{font-weight:700;font-size:.9rem;margin-left:6px}
textarea#memo{width:100%;min-height:130px;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;resize:vertical}
textarea#memo::placeholder{color:#8a8a8a}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.startMain{margin-top:16px}

/* modal */
#overlay{position:fixed;inset:0;z-index:100;background:rgba(40,25,10,.55);display:none;align-items:center;justify-content:center;padding:12px}
#overlay.show{display:flex}
#modal{background:var(--paper);border:3px solid var(--accent);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#modal h2{margin:0 0 10px;font-size:1.15rem}
#modal ul{padding-left:1.2em;margin:.4em 0}
#modal li{margin:.3em 0}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px}
.field input{width:100%;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff}
.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat{flex:1 1 90px;min-height:48px;padding:6px 8px;border-radius:12px;font-weight:800;background:#fff;border:3px solid var(--line)}
.cat.gu{border-color:var(--gu);color:var(--gu)} .cat.cho{border-color:var(--cho);color:var(--cho);border-style:dashed} .cat.mizu{border-color:var(--mizu);color:var(--mizu);border-style:double}
.cat.gu[aria-pressed="true"]{background:var(--gu);color:#fff} .cat.cho[aria-pressed="true"]{background:var(--cho);color:#fff} .cat.mizu[aria-pressed="true"]{background:var(--mizu);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{min-height:44px;padding:6px 12px;background:#fff;border:2px solid var(--mizu);border-radius:10px;font-weight:700;color:var(--mizu)}
.rlist{list-style:none;padding:0!important;margin:8px 0}
.ritem{border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;background:#fff}
.ritem.now{border-color:var(--accent);background:#fff6e6}
.ritem .rt{font-weight:700;word-break:break-all}
.ritem .rm{font-size:.8rem;color:var(--sub)}
.ritem .rb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.check li{list-style:none;margin-left:-1.2em}
.err{color:#8a1c1c;font-weight:700;font-size:.85rem;min-height:1.3em}

/* lock */
#lock{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;text-align:center}
#lock.show{display:flex}
#lock input{width:10em;min-height:52px;font-size:1.6rem;text-align:center;letter-spacing:.4em;border:3px solid var(--accent);border-radius:12px;background:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* steam animation (独立パーツ) */
#steam{position:fixed;inset:0;z-index:200;background:rgba(251,246,234,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#steam.show{display:flex}
.steamStage{position:relative;width:min(300px,70vw)}
.steamStage svg{width:100%;height:auto;display:block}
.puff{position:absolute;bottom:62%;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,rgba(150,150,150,.55),rgba(190,190,190,0) 70%);opacity:0;animation:rise 2.6s ease-out infinite}
.puff:nth-child(2){left:38%;animation-delay:0s}
.puff:nth-child(3){left:48%;animation-delay:.5s;width:58px;height:58px}
.puff:nth-child(4){left:56%;animation-delay:1s}
.puff:nth-child(5){left:43%;animation-delay:1.5s;width:52px;height:52px}
.puff:nth-child(6){left:52%;animation-delay:2s}
@keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:0}25%{opacity:.9}100%{transform:translate(14px,-150px) scale(1.9);opacity:0}}
.steamTxt{font-weight:800;font-size:1.05rem}
@media (prefers-reduced-motion:reduce){.puff{animation-duration:5s}}

/* toast + install */
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#3b2f26;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:400;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#installBar{position:fixed;left:8px;right:8px;bottom:8px;z-index:250;background:#fffaf0;border:3px solid var(--accent);border-radius:16px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translateY(140%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#installBar.show{transform:translateY(0)}
#installBar p{margin:0;flex:1 1 180px;font-size:.88rem;font-weight:700}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>🍚 なんでもたきこみごはん</h1>
    <p>わたしだけの炊き込みご飯を楽しむアプリ</p>
  </div>
  <nav class="menu" aria-label="メニュー">
    <button type="button" id="btnHelp" aria-label="使い方・注意書き">📖 使い方・注意書き</button>
    <button type="button" id="btnList" aria-label="レシピ一覧">📚 レシピ一覧</button>
    <button type="button" id="btnPass" aria-label="パスコード設定">🔒 パスコード設定</button>
  </nav>
</header>

<main class="wrap">
  <!-- 画面A：仕込み -->
  <section class="card" id="viewA" aria-label="仕込み画面">
    <div class="adate"><div id="aDate"></div><div id="aTitle"></div></div>
    <div class="cookerWrap">
      <div id="cookerSvgBox"></div>
      <div class="panel">
        <button type="button" id="btnAdd" aria-label="材料を追加する">＋ 追加</button>
        <button type="button" id="btnStart" aria-label="スタート（安全確認が表示されます）">▶ スタート</button>
      </div>
    </div>
    <p class="hint">※スタートを押すと安全確認が表示されます</p>

    <h2 class="sechead">仕込み中のリスト（タップで編集・削除）</h2>
    <div id="listA" class="ilist"></div>

    <button type="button" class="btn block startMain" id="toC">📝 できあがりの記録へ →</button>
  </section>

  <!-- 画面C：できあがり記録 -->
  <section class="card" id="viewC" aria-label="できあがり記録画面" hidden>
    <button type="button" class="btn" id="backA">← 仕込みに戻る</button>
    <input id="titleIn" type="text" maxlength="60" aria-label="レシピ名（任意）" placeholder="レシピ名を入力（空欄のままでもOK）">
    <div id="cDate" style="color:var(--sub);font-size:.9rem;font-weight:700;margin-top:6px"></div>
    <div class="status" id="status"></div>

    <h2 class="sechead">仕込んだ内容</h2>
    <div id="listC" class="ilist"></div>

    <h2 class="sechead">完成写真</h2>
    <div class="photoBox" id="photoBox"></div>
    <div class="btnrow">
      <button type="button" class="btn" id="btnCam">📷 カメラで撮影</button>
      <button type="button" class="btn" id="btnAlbum">🖼 アルバムから選ぶ</button>
      <button type="button" class="btn danger" id="btnPhotoDel">写真を外す</button>
    </div>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileAlbum" accept="image/*" hidden>

    <h2 class="sechead">評価</h2>
    <div class="stars" id="stars" role="group" aria-label="星評価"></div>

    <h2 class="sechead">メモ</h2>
    <textarea id="memo" maxlength="2000" aria-label="メモ" placeholder="例：おこげの具合、水加減、家族の反応、次回の改善点など"></textarea>

    <div class="actions">
      <button type="button" class="btn primary block" id="btnDup">🔁 このレシピを複製（Ver.2を作る）</button>
      <button type="button" class="btn primary block" id="btnImg">🖼 レシピカードを画像保存</button>
    </div>
  </section>
</main>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="modal"></div></div>

<div id="lock" role="dialog" aria-modal="true" aria-label="ロック画面">
  <div style="font-size:3rem" aria-hidden="true">🔒</div>
  <h2 style="margin:0">パスコードを入力</h2>
  <input id="lockIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="4桁のパスコード">
  <div class="err" id="lockErr" role="alert"></div>
  <button type="button" class="btn primary" id="lockBtn">ひらく</button>
</div>

<div id="steam" role="status" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="installBar" role="region" aria-label="ホーム画面に追加">
  <p id="installMsg">📲 ホーム画面に追加してアプリとして使う</p>
  <button type="button" class="btn primary" id="installOk">追加する</button>
  <button type="button" class="btn" id="installClose">閉じる</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  /* ---------- 基本ユーティリティ ---------- */
  var KEY = 'ntg_data_v1', PKEY = 'ntg_pass_v1', IKEY = 'ntg_install_closed_v1';
  var mem = {};
  var store = {
    get: function (k) { try { var v = localStorage.getItem(k); return v === null ? (mem[k] === undefined ? null : mem[k]) : v; } catch (e) { return mem[k] === undefined ? null : mem[k]; } },
    set: function (k, v) { mem[k] = v; try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: function (k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
  };
  var $ = function (s) { return document.querySelector(s); };
  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) { for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    } }
    (kids || []).forEach(function (c) { if (c == null) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3200);
  }

  var ORDER = ['gu', 'cho', 'mizu'];
  var TYPES = { gu: { label: '具材', icon: '🥕' }, cho: { label: '調味料', icon: '🧂' }, mizu: { label: '水加減', icon: '💧' } };
  var WATER_PRESETS = ['規定量（合数どおり）', '+50ml', '+30ml', '-30ml', '-50ml'];
  var STAR_TXT = ['未評価', '★1 もう一息', '★2 まあまあ', '★3 おいしい', '★4 とてもおいしい', '★5 最高！'];
  var FONT = '"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';

  /* ---------- データ ---------- */
  var state = { recipes: [], currentId: null };
  var view = 'A';

  function newRecipe(title) {
    return { id: uid(), title: title || '', date: today(), items: [], photo: '', rating: 0, memo: '', cooked: false };
  }
  function cur() { for (var i = 0; i < state.recipes.length; i++) if (state.recipes[i].id === state.currentId) return state.recipes[i]; return null; }
  function fmtDate(d) { return String(d || '').replace(/-/g, '/'); }
  function displayName(r) { return (r.title && r.title.trim()) ? r.title.trim() : (fmtDate(r.date) + ' のごはん'); }
  function load() {
    try {
      var raw = store.get(KEY);
      if (raw) { var d = JSON.parse(raw); if (d && Array.isArray(d.recipes)) { state.recipes = d.recipes; state.currentId = d.currentId; } }
    } catch (e) { console.error(e); toast('保存データを読み込めなかったため、新しく始めます'); }
    if (!state.recipes.length) { var r = newRecipe(); state.recipes.push(r); state.currentId = r.id; }
    if (!cur()) state.currentId = state.recipes[0].id;
  }
  function save(quiet) {
    try { if (store.set(KEY, JSON.stringify(state))) return true; } catch (e) { console.error(e); }
    try {
      var lite = { currentId: state.currentId, recipes: state.recipes.map(function (r) { return r.id === state.currentId ? Object.assign({}, r, { photo: '' }) : r; }) };
      var ok = store.set(KEY, JSON.stringify(lite));
      if (!quiet) toast(ok ? '端末の保存容量がいっぱいのため、写真以外を保存しました' : '保存できませんでした。この画面を開いている間は内容を保持します');
      return ok;
    } catch (e2) { if (!quiet) toast('保存でエラーが起きました。内容はこの画面内で保持します'); return false; }
  }
  var saveTimer = null;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { save(); }, 400); }

  /* ---------- 炊飯器SVG ---------- */
  function cookerSvg() {
    return '<svg viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="炊飯器のイラスト">' +
      '<ellipse cx="100" cy="178" rx="72" ry="8" fill="rgba(90,60,30,.18)"/>' +
      '<rect x="26" y="78" width="148" height="94" rx="28" fill="#f4e3c3" stroke="#8c4a2f" stroke-width="4"/>' +
      '<path d="M32 80 Q100 4 168 80 Z" fill="#fff3da" stroke="#8c4a2f" stroke-width="4" stroke-linejoin="round"/>' +
      '<rect x="88" y="28" width="24" height="12" rx="6" fill="#8c4a2f"/>' +
      '<rect x="44" y="96" width="112" height="44" rx="12" fill="#fffaf0" stroke="#8c4a2f" stroke-width="3"/>' +
      '<path d="M60 156 Q100 166 140 156" fill="none" stroke="#c9b79a" stroke-width="4" stroke-linecap="round"/>' +
      '</svg>';
  }

  /* ---------- モーダル基盤 ---------- */
  var lastFocus = null;
  function openModal(title, nodes) {
    var m = $('#modal'), o = $('#overlay'); if (!m || !o) return;
    lastFocus = document.activeElement;
    m.innerHTML = '';
    m.appendChild(h('h2', { id: 'modalTitle', text: title }));
    nodes.forEach(function (n) { m.appendChild(n); });
    o.classList.add('show');
    var first = m.querySelector('input,button,textarea'); if (first) { try { first.focus(); } catch (e) {} }
  }
  function closeModal() {
    var o = $('#overlay'); if (o) o.classList.remove('show');
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  var ovEl = $('#overlay');
  if (ovEl) ovEl.addEventListener('click', function (e) { if (e.target === ovEl) closeModal(); });

  /* ---------- レシピカード画像保存 ---------- */
  function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {

      var line = '';

        var y = 240, cols = { gu: ['#00694f', '#e3f3d9'], cho: ['#8a5300', '#fdeab5'], mizu: ['#0b5a8c', '#dff0fb'] };

          ctx.fillStyle = cols[t][1]; ctx.fillRect(M, y - 34, W - M * 2, 46);
          ctx.fillStyle = cols[t][0]; ctx.fillRect(M, y - 34, 10, 46);
          ctx.font = 'bold 28px ' + FONT; ctx.fillText(TYPES[t].icon + ' 【' + TYPES[t].label + '】', M + 24, y);
          y += 44; ctx.font = '27px ' + FONT;
          var its = r.items.filter(function (i) { return i.type === t; });
          if (!its.length) { ctx.fillStyle = '#8a8a8a'; ctx.fillText('（なし）', M + 24, y); y += 38; }
          its.slice(0, MAXN).forEach(function (i) { ctx.fillStyle = '#3b2f26'; ctx.fillText('・' + i.name + (i.amount ? '　' + i.amount : ''), M + 24, y, W - M * 2 - 40); y += 38; });
          if (its.length > MAXN) { ctx.fillStyle = '#6b5b4d'; ctx.fillText('…ほか' + (its.length - MAXN) + '件', M + 24, y); y += 38; }
          y += 24;
        });
        y -= 4;
        var pw = W - M * 2;
        ctx.fillStyle = '#fff'; ctx.fillRect(M, y, pw, photoH); ctx.strokeStyle = '#c9b79a'; ctx.lineWidth = 3; ctx.strokeRect(M, y, pw, photoH);
        if (img) {
          var s = Math.max(pw / img.width, photoH / img.height), sw = pw / s, sh = photoH / s;
          ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, M, y, pw, photoH);
        } else { ctx.fillStyle = '#8a8a8a'; ctx.font = '28px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('写真なし', W / 2, y + photoH / 2); ctx.textAlign = 'left'; }
        y += photoH + 70;
        ctx.fillStyle = '#7a4b00'; ctx.font = 'bold 44px ' + FONT; ctx.fillText(starStr(r.rating) + '  ' + r.rating + ' / 5', M, y);
        y += 56; ctx.fillStyle = '#3b2f26'; ctx.font = 'bold 26px ' + FONT; ctx.fillText('メモ', M, y);
        y += 44; ctx.font = '27px ' + FONT;
        wrapText(ctx, r.memo || '（メモなし）', M, y, pw, 40, 6);
        ctx.fillStyle = '#6b5b4d'; ctx.font = '19px ' + FONT; ctx.textAlign = 'right';
        ctx.fillText('※ご使用の炊飯器の取扱説明書・最大水位線を守って安全に調理しています', W - 48, H - 46);
        c.toBlob(function (blob) {
          try {
            if (!blob) throw new Error('blob');
            var url = URL.createObjectURL(blob), a = document.createElement('a');
            a.href = url; a.download = 'takikomi-' + r.date + '.png'; document.body.appendChild(a); a.click();
            setTimeout(function () { try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {} }, 1500);
            toast('🖼 レシピカードを画像として保存しました');
          } catch (e) { console.error(e); toast('画像の保存に失敗しました'); }
        }, 'image/png');
      } catch (e) { console.error(e); toast('画像の作成に失敗しました'); }
    };
    try {
      if (r.photo) { var im = new Image(); im.onload = function () { finish(im); }; im.onerror = function () { finish(null); }; im.src = r.photo; }
      else finish(null);
    } catch (e) { finish(null); }
  }

  /* ---------- PWAインストール案内 ---------- */
  var deferredPrompt = null;
  function showInstall(msg) {
    try {
      if (store.get(IKEY)) return;
      var bar = $('#installBar'), m = $('#installMsg'); if (!bar) return;
      if (msg && m) m.textContent = msg;
      setTimeout(function () { bar.classList.add('show'); }, 1200);
    } catch (e) {}
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; showInstall(); });
  window.addEventListener('appinstalled', function () { var b = $('#installBar'); if (b) b.classList.remove('show'); store.set(IKEY, '1'); });
  function setupInstall() {
    var ok = $('#installOk'), cl = $('#installClose'), bar = $('#installBar');
    if (cl) cl.addEventListener('click', function () { if (bar) bar.classList.remove('show'); store.set(IKEY, '1'); });
    if (ok) ok.addEventListener('click', function () {
      try {
        if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(function () { deferredPrompt = null; if (bar) bar.classList.remove('show'); store.set(IKEY, '1'); }); }
        else toast('ブラウザの共有／メニューから「ホーム画面に追加」を選んでください');
      } catch (e) { toast('ブラウザのメニューから「ホーム画面に追加」を選んでください'); }
    });
    var standalone = false;
    try { standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone; } catch (e) {}
    if (!standalone) setTimeout(function () { if (!deferredPrompt) showInstall('📲 ホーム画面に追加してアプリとして使う（共有メニュー →「ホーム画面に追加」）'); }, 2500);
  }

  /* ---------- イベント登録 ---------- */
  function on(sel, ev, fn) { var e = $(sel); if (e) e.addEventListener(ev, function (x) { try { fn(x); } catch (err) { console.error(err); toast('エラーが起きましたが、記録は保持されています'); } }); }

  load();
  var sb = $('#cookerSvgBox'); if (sb) sb.innerHTML = cookerSvg();
  on('#btnAdd', 'click', function () { openItemModal(null); });
  on('#btnStart', 'click', startCooking);
  on('#toC', 'click', function () { showView('C'); });
  on('#backA', 'click', function () { showView('A'); });
  on('#btnHelp', 'click', openHelp);
  on('#btnList', 'click', openList);
  on('#btnPass', 'click', openPass);
  on('#titleIn', 'input', function (e) { var r = cur(); if (r) { r.title = e.target.value; saveSoon(); } });
  on('#memo', 'input', function (e) { var r = cur(); if (r) { r.memo = e.target.value; saveSoon(); } });
  on('#btnCam', 'click', function () { var f = $('#fileCam'); if (f) f.click(); });
  on('#btnAlbum', 'click', function () { var f = $('#fileAlbum'); if (f) f.click(); });
  on('#fileCam', 'change', function (e) { handleFile(e.target.files && e.target.files[0], e.target); });
  on('#fileAlbum', 'change', function (e) { handleFile(e.target.files && e.target.files[0], e.target); });
  on('#btnPhotoDel', 'click', function () { var r = cur(); if (r) { r.photo = ''; save(); renderRecord(r); toast('写真を外しました'); } });
  on('#btnDup', 'click', function () { var r = cur(); if (r) dupRecipe(r.id); });
  on('#btnImg', 'click', saveCardImage);

  showView('A');
  setupLock();
  setupInstall();

  try {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        try { navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('SW register failed', e); }); } catch (e) { console.warn(e); }
      });
    }
  } catch (e) { console.warn(e); }
});
